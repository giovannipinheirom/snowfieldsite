<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none" class="w-auto h-full">
  <defs>
    <linearGradient id="snowfieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="iceAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Símbolo / Emblema Snowfield (Geométrico Moderno) -->
  <g transform="translate(4, 6)">
    <!-- Floco / Cristal geométrico central -->
    <circle cx="30" cy="30" r="28" fill="#F0FDFA" stroke="#CFFAFE" stroke-width="2"/>
    
    <!-- Eixos do cristal -->
    <line x1="30" y1="12" x2="30" y2="48" stroke="url(#snowfieldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="46" y2="30" stroke="url(#snowfieldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="18" y1="18" x2="42" y2="42" stroke="url(#iceAccent)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="42" x2="42" y2="18" stroke="url(#iceAccent)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Detalhes nas pontas -->
    <path d="M 26 16 L 30 12 L 34 16" fill="none" stroke="url(#snowfieldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 26 44 L 30 48 L 34 44" fill="none" stroke="url(#snowfieldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 16 26 L 12 30 L 16 34" fill="none" stroke="url(#snowfieldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 26 L 48 30 L 44 34" fill="none" stroke="url(#snowfieldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Núcleo central -->
    <circle cx="30" cy="30" r="4.5" fill="#0891B2"/>
    <circle cx="30" cy="30" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Tipografia -->
  <text x="76" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em" fill="#0F172A">
    SNOWFIELD
  </text>
  <text x="77" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.28em" fill="#0891B2">
    LANGUAGES
  </text>
</svg>
